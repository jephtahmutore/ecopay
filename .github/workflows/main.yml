
name: Flutter CI

on:
  push:
    branches: [ main, 'glass-*', 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # adds a manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java (needed for Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: ecopay-apk
          path: build/app/outputs/flutter-apk/app-release.apk

          
  windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Save the Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ecopay-windows
          path: build/windows/x64/runner/Release/

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Build web app for Chrome and Edge
        run: |
          flutter build web --release --no-web-resources-cdn
          # Relative base so the app runs from any folder or preview host.
          sed -i 's|<base href="/">|<base href="./">|' build/web/index.html

      - name: Save the web app
        uses: actions/upload-artifact@v4
        with:
          name: ecopay-web
          path: build/web
